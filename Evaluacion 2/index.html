<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Tienda de Computadores</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="encabezado">
    <h1>TechStore</h1>
    <p>Tu tienda online de computadores</p>
  </header>

  <main class="contenido-principal">

    <!-- SECCIÓN DE PRODUCTOS: JavaScript renderizará las tarjetas aquí -->
    <section class="seccion-productos">
      <h2>Nuestros Productos</h2>
      <div id="contenedor-productos">
        <!-- Tarjeta de ejemplo (pueden eliminarla al implementar JS) -->
        <div class="tarjeta-producto">
          <h3>Ejemplo Laptop Demo</h3>
          <div class="precio">$799.990</div>
          <div class="stock">Stock: 4</div>
          <button class="btn-agregar" data-precio="799990">Agregar</button>
        </div>
        <!-- Las tarjetas serán generadas dinámicamente por script.js -->
      </div>
    </section>

    <!-- SECCIÓN INFERIOR: carrito + formulario -->
    <section class="seccion-inferior">

      <!-- Resumen del carrito -->
      <div class="carrito-resumen">
        <h2>Carrito de Compras</h2>
        <p class="total-texto">
          Total acumulado: <span id="total-compra">$0</span>
        </p>
      </div>

      <!-- Formulario de pago -->
      <div class="formulario-contenedor">
        <h2>Formulario de Pago</h2>
        <form id="form-pago">

          <div class="campo-form">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
          </div>

          <div class="campo-form">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="Ej: juan@correo.com">
          </div>

          <div class="campo-form">
            <label for="tarjeta">Número de Tarjeta Visa</label>
            <input type="text" id="tarjeta" placeholder="16 dígitos, comienza con 4" maxlength="16">
          </div>

          <div class="campo-form">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" placeholder="3 dígitos" maxlength="3">
          </div>

          <button type="submit" class="btn-pagar">Finalizar Compra</button>

        </form>
        <p id="mensaje-validacion"></p>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
